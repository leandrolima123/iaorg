# Tema de login do IAORG: herda o keycloak.v2 (PatternFly 5) e aplica a identidade visual do app.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/iaorg-v6.css

# Sempre claro (concreto), como o app; sem alternar pelo tema do sistema.
darkMode=false
kcHtmlClass=login-pf iaorg

locales=pt-BR,en

# Ao mudar o CSS, renomeie o arquivo (iaorg-vN.css) e atualize styles=: o nome novo fura qualquer cache.
iaorgThemeVersion=6
