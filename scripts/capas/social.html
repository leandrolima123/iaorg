<!doctype html>
<!-- Imagem de compartilhamento do site (1200×630, Open Graph / X / WhatsApp). O social.mjs tira o print.
     Mesmo visual das capas: fontes e logo do próprio repositório, um quadro do vídeo do escritório. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Archivo; font-weight: 400; src: url(../../keycloak/themes/iaorg/login/resources/fonts/archivo-latin-400-normal.woff2); }
  @font-face { font-family: Archivo; font-weight: 600; src: url(../../keycloak/themes/iaorg/login/resources/fonts/archivo-latin-600-normal.woff2); }
  @font-face { font-family: Barlow; font-weight: 800; src: url(../../keycloak/themes/iaorg/login/resources/fonts/barlow-condensed-latin-800-normal.woff2); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0b0b0c; }
  body { position: relative; font-family: Archivo, system-ui, sans-serif; color: #f4f4f2; --c: #f2c200; }
  .glow { position: absolute; inset: 0; background:
    radial-gradient(60% 75% at 6% 0%, color-mix(in srgb, var(--c) 34%, transparent), transparent 62%),
    radial-gradient(55% 70% at 100% 100%, color-mix(in srgb, var(--c) 20%, transparent), transparent 65%); }
  .grid { position: absolute; inset: 0; opacity: .22;
    background-image: linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px);
    background-size: 48px 48px; mask-image: radial-gradient(80% 80% at 70% 60%, #000, transparent 75%); }
  .stage { position: absolute; left: 610px; top: 150px; width: 680px; perspective: 1800px; }
  .screen { width: 100%; aspect-ratio: 16 / 9; border-radius: 20px; overflow: hidden; position: relative;
    transform: rotateY(-16deg) rotateX(5deg) rotateZ(-1deg); transform-origin: left center;
    border: 1px solid rgba(255,255,255,.18);
    box-shadow: 0 50px 120px rgba(0,0,0,.7), 0 0 0 10px rgba(255,255,255,.035), 0 0 90px color-mix(in srgb, var(--c) 28%, transparent); }
  .screen img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .screen::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,.16), transparent 32%), linear-gradient(0deg, rgba(0,0,0,.35), transparent 40%); }
  .txt { position: absolute; left: 64px; top: 60px; width: 560px; }
  .marca { display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: 26px; letter-spacing: .02em; }
  .marca img { width: 50px; height: 50px; border-radius: 10px; }
  h1 { font-family: Barlow, Archivo, sans-serif; font-weight: 800; text-transform: uppercase; font-size: 90px; line-height: .9; letter-spacing: -.01em; margin-top: 40px; }
  h1 em { font-style: normal; color: var(--c); }
  p { margin-top: 26px; width: 500px; font-size: 25px; line-height: 1.38; color: rgba(244,244,242,.74); }
  .chips { position: absolute; left: 64px; bottom: 52px; display: flex; gap: 10px; }
  .chips span { font-size: 18px; font-weight: 600; padding: 8px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.05); }
  .fita { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: repeating-linear-gradient(-45deg, var(--c) 0 22px, #111 22px 44px); opacity: .9; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="stage"><div class="screen"><img src="../../public/videos/escritorio.jpg" alt=""></div></div>
  <div class="txt">
    <div class="marca"><img src="../../public/brand/iaorg-mark.svg" alt="">IAORG</div>
    <h1>Dê a ordem. A equipe toca a <em>obra.</em></h1>
    <p>Agentes de IA e pessoas no mesmo organograma, num escritório 3D.</p>
  </div>
  <div class="chips"><span>Código aberto · MIT</span><span>Roda no Docker</span></div>
  <div class="fita"></div>
</body>
</html>
