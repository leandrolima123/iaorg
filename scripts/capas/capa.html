<!doctype html>
<!-- Molde das capas dos vídeos de demonstração (1280×720). O gerar.mjs abre esta página com
     ?id=…&n=…&titulo=…&cor=…&icone=…&quadro=… e tira um print. Fontes e logo vêm do próprio repositório. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Archivo; font-weight: 400; src: url(../../keycloak/themes/iaorg/login/resources/fonts/archivo-latin-400-normal.woff2); }
  @font-face { font-family: Archivo; font-weight: 600; src: url(../../keycloak/themes/iaorg/login/resources/fonts/archivo-latin-600-normal.woff2); }
  @font-face { font-family: Barlow; font-weight: 800; src: url(../../keycloak/themes/iaorg/login/resources/fonts/barlow-condensed-latin-800-normal.woff2); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #0b0b0c; }
  body { position: relative; font-family: Archivo, system-ui, sans-serif; color: #f4f4f2; --c: #f2c200; }
  /* luz na cor da demo + grade de piso de obra */
  .glow { position: absolute; inset: 0; background:
    radial-gradient(60% 75% at 8% 0%, color-mix(in srgb, var(--c) 38%, transparent), transparent 62%),
    radial-gradient(55% 70% at 100% 100%, color-mix(in srgb, var(--c) 22%, transparent), transparent 65%); }
  .grid { position: absolute; inset: 0; opacity: .22;
    background-image: linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px);
    background-size: 48px 48px; mask-image: radial-gradient(80% 80% at 70% 60%, #000, transparent 75%); }
  /* tela inclinada com um quadro do vídeo */
  .stage { position: absolute; left: 600px; top: 150px; width: 760px; perspective: 1800px; }
  .screen { width: 100%; aspect-ratio: 16 / 9; border-radius: 22px; overflow: hidden; position: relative;
    transform: rotateY(-16deg) rotateX(5deg) rotateZ(-1deg); transform-origin: left center;
    border: 1px solid rgba(255,255,255,.18);
    box-shadow: 0 50px 120px rgba(0,0,0,.7), 0 0 0 10px rgba(255,255,255,.035), 0 0 90px color-mix(in srgb, var(--c) 30%, transparent); }
  .screen img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .screen::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,.16), transparent 32%), linear-gradient(0deg, rgba(0,0,0,.35), transparent 40%); }
  /* sem quadro (em breve): ícone grande */
  .screen.vazia { display: grid; place-items: center; background: radial-gradient(90% 90% at 30% 20%, color-mix(in srgb, var(--c) 30%, #18181a), #111113); }
  .screen.vazia svg { width: 30%; height: 30%; color: var(--c); filter: drop-shadow(0 10px 30px color-mix(in srgb, var(--c) 50%, transparent)); }
  /* texto */
  .txt { position: absolute; left: 72px; top: 68px; width: 560px; }
  .marca { display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: 22px; letter-spacing: .02em; }
  .marca img { width: 44px; height: 44px; border-radius: 10px; }
  .marca .n { color: var(--c); font-weight: 600; letter-spacing: .14em; font-size: 17px; text-transform: uppercase; margin-left: 4px; }
  h1 { font-family: Barlow, Archivo, sans-serif; font-weight: 800; text-transform: uppercase; font-size: 92px; line-height: .9; letter-spacing: -.01em; margin-top: 34px; text-wrap: balance; }
  h1 em { font-style: normal; color: var(--c); }
  p { margin-top: 26px; width: 470px; font-size: 24px; line-height: 1.4; color: rgba(244,244,242,.72); text-wrap: pretty; }
  .fita { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: repeating-linear-gradient(-45deg, var(--c) 0 22px, #111 22px 44px); opacity: .9; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="stage"><div class="screen" id="screen"></div></div>
  <div class="txt">
    <div class="marca"><img src="../../public/brand/iaorg-mark.svg" alt="">IAORG <span class="n" id="n"></span></div>
    <h1 id="titulo"></h1>
    <p id="desc"></p>
  </div>
  <div class="fita"></div>
<script>
  const q = new URLSearchParams(location.search);
  const ICON = {
    mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
    git: '<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7"/><path d="M18 10.5c0 4-6 3-11 6"/>',
    order: '<path d="M4 6h16M4 12h10M4 18h7"/><path d="m15 17 2 2 4-4"/>',
    team: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16 14.2a5 5 0 0 1 5.5 4.8"/>',
    radar: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 12 19 5"/>',
    phone: '<rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18h2"/>',
  };
  const cor = q.get('cor') || '#f2c200';
  if (/^#[0-9a-f]{6}$/i.test(cor)) document.body.style.setProperty('--c', cor);
  document.getElementById('n').textContent = q.get('n') ? `Demo ${q.get('n')}` : '';
  // a última palavra do título fica na cor da demo
  const t = (q.get('titulo') || '').trim().split(/\s+/);
  const h = document.getElementById('titulo');
  h.textContent = t.slice(0, -1).join(' ') + ' ';
  const em = document.createElement('em'); em.textContent = t.at(-1) || ''; h.append(em);
  document.getElementById('desc').textContent = q.get('desc') || '';
  const s = document.getElementById('screen');
  if (q.get('quadro')) { const i = new Image(); i.src = q.get('quadro'); s.append(i); }
  else { s.classList.add('vazia'); s.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICON[q.get('icone')] || ICON.order}</svg>`; }
</script>
</body>
</html>
