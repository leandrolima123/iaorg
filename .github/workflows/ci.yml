name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # valores só para os testes; nada aqui é segredo de verdade
      APP_SECRET: ci-somente-teste-0000000000000000000000000000000000000000
      RUNNER_URL: http://runner:8787
      RUNNER_TOKEN: ci-somente-teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sintaxe de todos os arquivos JavaScript
        run: |
          git ls-files '*.js' '*.mjs' | grep -v '^public/vendor/' | while read -r f; do node --check "$f" || exit 1; done
      - name: Testes (sem rede e sem custo)
        run: |
          for t in access customer routines whatsapp-ads workbench; do
            echo "::group::test-$t"; node scripts/test-$t.mjs; echo "::endgroup::"
          done
      - name: Plugin do Claude Code (JSON válido)
        run: |
          for f in .claude-plugin/marketplace.json plugins/iaorg/.claude-plugin/plugin.json plugins/iaorg/.mcp.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "ok $f"; done

  imagens:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Imagem do app
        run: docker build -t iaorg-ci .
      - name: Imagem do site (landing)
        run: docker build -f site/Dockerfile -t iaorg-site-ci .
